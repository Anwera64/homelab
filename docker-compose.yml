services:
  # ==============================================================================
  # 1. Network & VPN Gateway (Gluetun)
  # ==============================================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRY:-United States}
      - TZ=${TZ:-America/Mexico_City}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}
    ports:
      - 6881:6881       # qBittorrent Torrent Protocol (TCP)
      - 6881:6881/udp   # qBittorrent Torrent Protocol (UDP)
    restart: unless-stopped

  # ==============================================================================
  # 2. Download Clients & Solvers (Routed strictly through VPN)
  # ==============================================================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Mexico_City}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${MEDIA_ROOT}:/data
    depends_on:
      - gluetun
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/Mexico_City}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    restart: unless-stopped

  # ==============================================================================
  # 3. Arr Automation Suite (Unified /data Volume for Instant 0-byte Hardlinks)
  # ==============================================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Mexico_City}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Mexico_City}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Mexico_City}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Mexico_City}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped

  # ==============================================================================
  # 4. Request UI & Discovery (Jellyseerr)
  # ==============================================================================
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - ${CONFIG_PATH}/jellyseerr:/app/config
    restart: unless-stopped

  # ==============================================================================
  # 5. Media Server (Jellyfin with RTX 5080 NVENC Transcoding)
  # ==============================================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/data:ro
      - ${MOVIES_PATH}:/media/movies:ro
      - ${SHOWS_PATH}:/media/tv:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ==============================================================================
  # 6. Media Analytics & Telemetry (Jellystat)
  # ==============================================================================
  jellystat-db:
    image: postgres:16-alpine
    container_name: jellystat-db
    environment:
      - POSTGRES_USER=${JELLYSTAT_DB_USER:-jellystat}
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD:-jellystat}
      - POSTGRES_DB=${JELLYSTAT_DB_NAME:-jellystat}
    volumes:
      - ${CONFIG_PATH}/jellystat/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JELLYSTAT_DB_USER:-jellystat} -d ${JELLYSTAT_DB_NAME:-jellystat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    environment:
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${JELLYSTAT_DB_USER:-jellystat}
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD:-jellystat}
      - POSTGRES_DB=${JELLYSTAT_DB_NAME:-jellystat}
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET:-jellystat_secret_token_12345}
      - TZ=${TZ:-America/Mexico_City}
    depends_on:
      jellystat-db:
        condition: service_healthy
    restart: unless-stopped

  # ==============================================================================
  # 7. Automated Media Lifecycle & Cleanup (Maintainerr)
  # ==============================================================================
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - NODE_ENV=production
    volumes:
      - ${CONFIG_PATH}/maintainerr:/opt/data
    depends_on:
      - sonarr
      - radarr
      - jellyfin
    restart: unless-stopped

  # ==============================================================================
  # 8. Dashboard & Unified Portal (Homepage)
  # ==============================================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - HOMEPAGE_ALLOWED_HOSTS=*
      - HOMEPAGE_VAR_GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY}
    volumes:
      - ${CONFIG_PATH}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ==============================================================================
  # 9. TRaSH Guides Automation (Recyclarr)
  # ==============================================================================
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - CRON_SCHEDULE=0 3 * * * # Automatically sync daily at 3:00 AM
    volumes:
      - ${CONFIG_PATH}/recyclarr:/config
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # ==============================================================================
  # 10. Remote Mesh Gateway (Tailscale)
  # ==============================================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-homelab}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_HOSTNAME=${TS_HOSTNAME:-homelab}
      - TS_USERSPACE=false
      - TS_PORT=41641
      - TS_TAILSCALED_EXTRA_ARGS=--port=41641
    volumes:
      - ${CONFIG_PATH}/tailscale:/var/lib/tailscale
      - tailscale_sock:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      # Direct Tailscale WireGuard UDP Port
      - 41641:41641/udp
      - 80:80
      - 443:443
      - 3000:3000
      # Local HTTP Service Ports
      - 8096:8096
      - 5055:5055
      - 3005:3005
      - 6246:6246
      - 8080:8080
      - 8989:8989
      - 7878:7878
      - 9696:9696
      - 6767:6767
      - 8191:8191
      # Remote Tailscale HTTPS Service Ports
      - 8443:8443
      - 15055:15055
      - 13005:13005
      - 16246:16246
      - 18080:18080
      - 18989:18989
      - 17878:17878
      - 19696:19696
      - 16767:16767
      - 18191:18191
    restart: unless-stopped

  # ==============================================================================
  # 11. Reverse Proxy & Hostname Routing (Caddy)
  # ==============================================================================
  caddy:
    image: caddy:latest
    container_name: caddy
    network_mode: "service:tailscale"
    volumes:
      - ${CONFIG_PATH}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${CONFIG_PATH}/caddy/data:/data
      - ${CONFIG_PATH}/caddy/config:/config
      - tailscale_sock:/var/run/tailscale
    depends_on:
      - tailscale
      - homepage
    restart: unless-stopped

volumes:
  tailscale_sock:
