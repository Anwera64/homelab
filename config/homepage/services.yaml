---
# ==============================================================================
# Homepage Services Configuration
# ==============================================================================

- Media & Streaming:
    - Jellyfin:
        icon: jellyfin.png
        href: http://desktop-kujo8mp:8096
        description: Media Streaming (RTX 5080 NVENC)
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          enableNowPlaying: true
          enableBlocks: true

    - Jellyseerr:
        icon: jellyseerr.png
        href: http://desktop-kujo8mp:5055
        description: Netflix-style Request & Discovery UI
        server: my-docker
