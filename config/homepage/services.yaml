---
# ==============================================================================
# Homepage Services Configuration (DuckDNS Subdomain Architecture)
# Homepage runs on the Pi (hosts/pi). Desktop services are reached on the ports
# their containers publish on 192.168.1.20 and checked over HTTP (siteMonitor);
# only the Pi's own containers use Docker status (my-docker = the Pi's socket).
# ==============================================================================

- Media & Streaming:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.spicy-llama.duckdns.org
        description: Media Streaming (RTX 5080 NVENC)
        siteMonitor: http://192.168.1.20:8096
        widget:
          type: jellyfin
          url: http://192.168.1.20:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          version: 2
          enableNowPlaying: true
          enableBlocks: true

    - Seerr:
        icon: seerr.png
        href: https://seerr.spicy-llama.duckdns.org
        description: Netflix-style Request & Discovery UI
        siteMonitor: http://192.168.1.20:5055
        widget:
          type: seerr
          url: http://192.168.1.20:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"

    - Jellystat:
        icon: jellystat.png
        href: https://stat.spicy-llama.duckdns.org
        description: Playback Analytics & Viewer Statistics
        siteMonitor: http://192.168.1.20:3005
        widget:
          type: customapi
          url: http://192.168.1.20:3005/stats/getLibraryCardStats
          headers:
            x-api-token: "{{HOMEPAGE_VAR_JELLYSTAT_API_KEY}}"
          mappings:
            - field: 0.Plays
              label: TV Plays
              format: number
            - field: 1.Plays
              label: Movie Plays
              format: number
            - field: 0.total_playback_duration
              label: TV Time
              format: duration
            - field: 1.total_playback_duration
              label: Movie Time
              format: duration


- Automation Suite:
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.spicy-llama.duckdns.org
        description: TV Series Management
        siteMonitor: http://192.168.1.20:8989
        widget:
          type: sonarr
          url: http://192.168.1.20:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"

    - Radarr:
        icon: radarr.png
        href: https://radarr.spicy-llama.duckdns.org
        description: Movie Collection Management
        siteMonitor: http://192.168.1.20:7878
        widget:
          type: radarr
          url: http://192.168.1.20:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.spicy-llama.duckdns.org
        description: Trackers & Indexer Proxy
        siteMonitor: http://192.168.1.20:9696
        widget:
          type: prowlarr
          url: http://192.168.1.20:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.spicy-llama.duckdns.org
        description: Automated Subtitle Sync
        siteMonitor: http://192.168.1.20:6767
        widget:
          type: bazarr
          url: http://192.168.1.20:6767
          key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"

    - Recyclarr:
        icon: recyclarr.png
        href: https://recyclarr.dev
        description: TRaSH Guides Quality & Format Sync (Daily 3 AM)

    - Maintainerr:
        icon: maintainerr.png
        href: https://maintainerr.spicy-llama.duckdns.org
        description: Automated Media Lifecycle & Cleanup
        siteMonitor: http://192.168.1.20:6246
        widget:
          type: customapi
          url: http://192.168.1.20:6246/api/collections
          mappings:
            - field: 0.mediaCount
              label: Queued Movies
              format: number
            - field: 1.mediaCount
              label: Queued Seasons
              format: number

    - Cleanuparr:
        icon: cleanuparr.png
        href: https://cleanuparr.spicy-llama.duckdns.org
        description: Download Queue Cleanup (Fakes, Failed Imports, Seeding Limits)
        siteMonitor: http://192.168.1.20:11011
        widget:
          type: customapi
          url: http://192.168.1.20:11011/api/v2/stats
          mappings:
            - field: strikes.total
              label: Strikes
              format: number
            - field: removals.total
              label: Removed
              format: number
            - field: cleaned.total
              label: Cleaned
              format: number
            - field: searches.grabbed
              label: Grabbed
              format: number

- Downloads & VPN Network:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbit.spicy-llama.duckdns.org
        description: Download Client (VueTorrent UI - Kill-Switch Isolated)
        siteMonitor: http://192.168.1.20:8080
        widget:
          type: qbittorrent
          url: http://192.168.1.20:8080

    - Gluetun VPN:
        icon: gluetun.png
        description: NordVPN WireGuard Gateway
        widget:
          type: gluetun
          url: http://192.168.1.20:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_API_KEY}}"
          version: 2

    - FlareSolverr:
        icon: flaresolverr.png
        href: https://flaresolverr.spicy-llama.duckdns.org
        description: Cloudflare Solver Proxy
        siteMonitor: http://192.168.1.20:8191

- Ingress & Security:
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Remote access via the Pi's subnet route

    - Caddy:
        icon: caddy.png
        href: https://spicy-llama.duckdns.org
        description: HTTPS Entry Point & DuckDNS Wildcard TLS (lemonpi)
        server: my-docker
        container: caddy

- Infrastructure & System:
    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.spicy-llama.duckdns.org/admin
        description: DNS, Ad Blocking & DHCP (lemonpi)
        server: my-docker
        container: pihole

    - Unbound:
        icon: unbound.png
        description: Private DNSSEC Resolver for Pi-hole (lemonpi)
        server: my-docker
        container: unbound

    - Watchtower:
        icon: watchtower.png
        description: Automated Image Updates on the desktop (Daily 4 AM)
