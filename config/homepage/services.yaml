---
# ==============================================================================
# Homepage Services Configuration (DuckDNS Subdomain Architecture)
# ==============================================================================

- Media & Streaming:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.spicy-llama.duckdns.org
        description: Media Streaming (RTX 5080 NVENC)
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          enableNowPlaying: true
          enableBlocks: true

    - Jellyseerr:
        icon: jellyseerr.png
        href: https://seerr.spicy-llama.duckdns.org
        description: Netflix-style Request & Discovery UI
        server: my-docker
        container: jellyseerr
        widget:
          type: jellyseerr
          url: http://jellyseerr:5055
          key: "{{HOMEPAGE_VAR_JELLYSEERR_API_KEY}}"

    - Jellystat:
        icon: jellystat.png
        href: https://stat.spicy-llama.duckdns.org
        description: Playback Analytics & Viewer Statistics
        server: my-docker
        container: jellystat
        widget:
          type: customapi
          url: http://jellystat:3000/stats/getLibraryCardStats
          headers:
            x-api-token: "{{HOMEPAGE_VAR_JELLYSTAT_API_KEY}}"
          mappings:
            - field: 0.Plays
              label: TV Plays
              format: number
            - field: 1.Plays
              label: Movie Plays
              format: number
            - field: 0.total_playback_duration
              label: TV Time
              format: duration
            - field: 1.total_playback_duration
              label: Movie Time
              format: duration

- Automation Suite:
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.spicy-llama.duckdns.org
        description: TV Series Management
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"

    - Radarr:
        icon: radarr.png
        href: https://radarr.spicy-llama.duckdns.org
        description: Movie Collection Management
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.spicy-llama.duckdns.org
        description: Trackers & Indexer Proxy
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.spicy-llama.duckdns.org
        description: Automated Subtitle Sync
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"

    - Recyclarr:
        icon: recyclarr.png
        href: https://recyclarr.dev
        description: TRaSH Guides Quality & Format Sync (Daily 3 AM)
        server: my-docker
        container: recyclarr

    - Maintainerr:
        icon: maintainerr.png
        href: https://maintainerr.spicy-llama.duckdns.org
        description: Automated Media Lifecycle & Cleanup
        server: my-docker
        container: maintainerr
        widget:
          type: customapi
          url: http://maintainerr:6246/api/collections
          mappings:
            - field: 0.mediaCount
              label: Queued Movies
              format: number
            - field: 1.mediaCount
              label: Queued Seasons
              format: number

- Downloads & VPN Network:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbit.spicy-llama.duckdns.org
        description: Download Client (VueTorrent UI - Kill-Switch Isolated)
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://gluetun:8080

    - Gluetun VPN:
        icon: gluetun.png
        description: NordVPN WireGuard Gateway
        server: my-docker
        container: gluetun
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: "{{HOMEPAGE_VAR_GLUETUN_API_KEY}}"
          version: 2

    - FlareSolverr:
        icon: flaresolverr.png
        href: https://flaresolverr.spicy-llama.duckdns.org
        description: Cloudflare Solver Proxy
        server: my-docker
        container: flaresolverr
        ping: http://flaresolverr:8191/

- Ingress & Security:
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Remote Mesh Encrypted Network
        server: my-docker
        container: tailscale

    - Caddy:
        icon: caddy.png
        href: https://spicy-llama.duckdns.org
        description: Reverse Proxy & DuckDNS Wildcard TLS
        server: my-docker
        container: caddy
