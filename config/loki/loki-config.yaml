# ==============================================================================
# Loki - single binary, logs on the loki_data volume (/loki), kept for 30 days.
# Nothing outside the compose network reaches it: Grafana is the way in.
# ==============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Retention only works on a tsdb index in 24h periods.
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/retention
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h
  # Retention is by age, not size. A container stuck in an error loop has its
  # lines dropped past this rate instead of filling Docker's disk.
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 5MB
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6

analytics:
  reporting_enabled: false
