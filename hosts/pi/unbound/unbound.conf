# Unbound for Pi-hole, replacing the image's default config (which listens on 0.0.0.0:53).
# Based on https://docs.pi-hole.net/guides/dns/unbound/ and klutchell/unbound's defaults.

server:
    # Container runtime: foreground, no chroot, log to stderr (docker -> journald -> log2ram).
    do-daemonize: no
    username: "unbound"
    chroot: ""
    logfile: ""
    pidfile: ""
    verbosity: 0

    # Only Pi-hole on the same host talks to Unbound.
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow

    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # The LAN has no public IPv6, so don't try IPv6 upstreams.
    do-ip6: no
    prefer-ip6: no

    # DNSSEC and hardening. root.hints/root.key ship with the image.
    root-hints: root.hints
    auto-trust-anchor-file: root.key
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Speed: prefetch popular names, serve stale answers while refreshing.
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Sized for a 1 GB Pi.
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
    so-sndbuf: 0

    # Never hand out private addresses for public names (DNS rebinding).
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
    # Except our own domain: *.spicy-llama.duckdns.org points at the LAN on purpose.
    private-domain: "spicy-llama.duckdns.org"
