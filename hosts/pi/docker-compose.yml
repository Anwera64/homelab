# ==============================================================================
# Raspberry Pi 5 (lemonpi): the house DNS
#   Pi-hole  -> blocks ads/trackers, answers every device on the LAN and tailnet
#   Unbound  -> Pi-hole's only upstream; resolves from the root servers with DNSSEC
# Both use host networking: Pi-hole owns :53 and :80/:443, Unbound 127.0.0.1:5335.
# Run through bootstrap.sh; see README.md.
# ==============================================================================

services:
  unbound:
    image: klutchell/unbound:1.26.1
    container_name: unbound
    network_mode: host
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    healthcheck:
      test: ["CMD", "drill-hc", "-p", "5335", "@127.0.0.1", "cloudflare.com"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  pihole:
    image: pihole/pihole:2026.09.0
    container_name: pihole
    network_mode: host
    depends_on:
      unbound:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in hosts/pi/.env}
      FTLCONF_dns_upstreams: '127.0.0.1#5335'
      # Answer LAN and Tailscale (100.x) clients; the Pi is never port-forwarded.
      FTLCONF_dns_listeningMode: 'ALL'
      # SD card wear: write the query database hourly, keep 30 days.
      FTLCONF_database_DBinterval: '3600'
      FTLCONF_database_maxDBdays: '30'
    volumes:
      - ./data/pihole:/etc/pihole
    tmpfs:
      - /var/log/pihole
    restart: unless-stopped
