org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Reuse task outputs across builds and CI jobs when their inputs haven't changed.
org.gradle.caching=true

# The apps' one version, for Android and iOS. The minor number is the MVP slice. iosApp/project.yml
# repeats it, and AppVariantsTest keeps the two equal.
app.version=0.5.1

# The hub each app talks to: debug builds are the dev app, release builds the household's.
# Point a build elsewhere with -Phub.devUrl=... or your user-level gradle.properties. The dev
# address is also the SDK's own default, generated into :core:data's BuildConfig.
hub.devUrl=https://hub-dev.spicy-llama.duckdns.org
hub.prodUrl=https://hub.spicy-llama.duckdns.org

# Where each app sends its logs (OTLP/HTTP, logs only). An empty value (-Ptelemetry.devUrl=) turns
# telemetry off for that build.
telemetry.devUrl=https://telemetry-dev.spicy-llama.duckdns.org
telemetry.prodUrl=https://telemetry.spicy-llama.duckdns.org
