name: Household Hub backend

# The backend's tests and its image. Renovate's hub dependency PRs merge only once this passes.

on:
  push:
    branches: [master]
    paths:
      - apps/household-hub/backend/**
      - .github/workflows/household-hub-backend.yml
  pull_request:
    branches: [master]
    paths:
      - apps/household-hub/backend/**
      - .github/workflows/household-hub-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/household-hub/backend

jobs:
  test:
    name: Tests (pytest) and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Python the image runs, so a base image bump moves CI with it.
      - name: Read the image's Python version
        id: python
        run: echo "version=$(sed -n 's/^FROM python:\(.*\)-slim$/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: apps/household-hub/backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build the image
        working-directory: .
        run: docker build --tag household-hub:ci apps/household-hub/backend
