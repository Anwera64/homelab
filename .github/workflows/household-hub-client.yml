name: Household Hub client

on:
  push:
    branches: [master]
    paths:
      - apps/household-hub/client/**
      - .github/workflows/household-hub-client.yml
      - .github/actions/setup-client/**
  # Plain pull_request on a public repo: fork code gets a read-only token and no secrets.
  pull_request:
    branches: [master]
    paths:
      - apps/household-hub/client/**
      - .github/workflows/household-hub-client.yml
      - .github/actions/setup-client/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are noise; every master run is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/household-hub/client

# compile -> jvm-tests -> android-ui-tests: each stage only runs once the one before it passed.
# ios-simulator-tests and ios-app-tests wait for nothing and start alongside compile, so a commit
# gets its Android and its iOS answer in the same wall clock instead of one after the other.
jobs:
  compile:
    name: Compile Android app and test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      - name: Assemble
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :core:data:assembleAndroidDeviceTest

      # setup-gradle only writes its cache from master, so hand this commit's build outputs to
      # android-ui-tests directly; otherwise it recompiles the same APKs on pull requests.
      - name: Save build cache for on-device tests
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compile-reports
          path: apps/household-hub/client/**/build/reports/

  jvm-tests:
    name: Unit and Compose UI tests (JVM)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      # The JVM target is only a test host: :composeApp:jvmTest is where the commonTest
      # screen tests run, and :shared:jvmTest holds the architecture guards.
      - name: Run tests
        run: ./gradlew jvmTest --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports
          path: apps/household-hub/client/**/build/reports/

  android-ui-tests:
    name: On-device tests (emulator, API 36)
    # The emulator is the slow part; it only boots for a commit that builds and passes its JVM tests.
    needs: jvm-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      - name: Restore build cache from compile
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: gradle-build-cache-${{ github.sha }}-

      # Hardware acceleration; without it the x86_64 emulator is unusably slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile before the emulator boots so it doesn't idle through the build.
      - name: Build app and test APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :core:data:assembleAndroidDeviceTest

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis-x86_64

      # API 36 ships no "default" system image, only google_apis variants.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run on-device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/household-hub/client
          script: ./gradlew :androidApp:connectedDebugAndroidTest :core:data:connectedAndroidDeviceTest --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ui-test-reports
          path: apps/household-hub/client/**/build/reports/

  ios-simulator-tests:
    name: Kotlin/Native tests (iOS simulator)
    # Pinned to Apple Silicon rather than macos-latest: the only iOS targets declared are iosArm64
    # and iosSimulatorArm64, so an Intel image has nothing here it can build.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      # The Kotlin/Native compiler and the Apple platform libraries are a multi-gigabyte first-run
      # download; the key tracks the Kotlin version, which is what decides the toolchain.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('apps/household-hub/client/gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      # The SSE tests need a server Kotlin/Native cannot host in-process; :shared's build starts and
      # stops the Python fixture around these tasks itself.
      - name: Run simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue

      # Its own invocation because the task's onlyIf demands to be named on the command line, and it
      # runs even after a failure above because it is the only guard on the NSURLSession timeout.
      - name: Run the long-pause SSE proof
        if: '!cancelled()'
        run: ./gradlew :shared:iosSimulatorArm64SlowSseLongPauseTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-test-reports
          path: apps/household-hub/client/**/build/reports/

  ios-app-tests:
    name: App-hosted tests (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-client

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('apps/household-hub/client/gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      # XcodeGen is not on the image, and the .xcodeproj is not committed, so without this there is
      # no project to build.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/household-hub/client/iosApp
        run: xcodegen generate

      # The image has shipped more than once with an Xcode whose paired simulator runtime was
      # missing, so take whichever iPhone is actually installed instead of naming a device that may
      # not exist that week. Booting it here rather than letting xcodebuild do it keeps a slow or
      # flaky CoreSimulator start out of the test timeout.
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys

          def ios_version(runtime):
              return [int(part) for part in runtime.rsplit(".", 1)[-1].split("-")[1:]]

          newest = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      if newest is None or ios_version(runtime) > newest[0]:
                          newest = (ios_version(runtime), device["udid"])
          if newest is None:
              sys.exit("This image has no installed iPhone simulator.")
          print(newest[1])
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # The Keychain is why this is xcodebuild and not Gradle: SecItem* answers only inside an
      # app-hosted bundle, which a bare Kotlin/Native test binary is not.
      - name: Run app-hosted tests
        working-directory: apps/household-hub/client/iosApp
        run: |
          xcodebuild test \
            -project HouseholdHub.xcodeproj \
            -scheme HouseholdHub \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath build/reports/ios-app-tests.xcresult

      # xcodebuild only ever builds the simulator slice, so this is the one thing in CI that proves
      # the framework still links for a real phone. Independent of the tests above, so a red test
      # does not hide a broken device build.
      - name: Link the device framework
        if: '!cancelled()'
        run: ./gradlew :iosApp:linkDebugFrameworkIosArm64

      # The .xcresult bundle is written under build/reports/ so it rides along with Gradle's own.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-test-reports
          path: apps/household-hub/client/**/build/reports/
