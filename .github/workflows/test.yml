name: CI Test Suite & Configuration Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit & Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Node.js Test Suite
        run: node --test

      - name: Validate Docker Compose Configuration
        run: |
          MEDIA_ROOT=/tmp/media MOVIES_PATH=/tmp/movies SHOWS_PATH=/tmp/shows DOWNLOADS_PATH=/tmp/downloads docker compose -f docker-compose.yml --env-file .env.example config -q

      - name: Validate Server Docker Compose Configuration
        run: |
          JELLYSTAT_DB_PASSWORD=validate JELLYSTAT_JWT_SECRET=validate HUB_SECRET_KEY=validate docker compose -f hosts/server/docker-compose.yml --env-file hosts/server/.env.example config -q

