name: Caddy + DuckDNS image

# Builds hosts/pi/caddy/Dockerfile (Caddy with the DuckDNS DNS plugin) for the Pi (arm64) and
# x86 machines, and publishes it as ghcr.io/anwera64/caddy-duckdns:<caddy version>. Compiling
# it on the 1 GB Pi risks running out of memory, so CI does it. Monthly rebuilds pick up Caddy
# releases; bump the tag pinned in hosts/pi/docker-compose.yml to roll one out.

on:
  push:
    branches: [ "master" ]
    paths:
      - 'hosts/pi/caddy/Dockerfile'
      - '.github/workflows/caddy-image.yml'
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/anwera64/caddy-duckdns

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for this runner to read the Caddy version
        uses: docker/build-push-action@v6
        with:
          context: hosts/pi/caddy
          file: hosts/pi/caddy/Dockerfile
          load: true
          tags: caddy-duckdns:probe

      - name: Read the Caddy version
        id: version
        run: echo "tag=$(docker run --rm caddy-duckdns:probe caddy version | grep -oE '^v[0-9.]+' | tr -d v)" >> "$GITHUB_OUTPUT"

      - name: Build and push both architectures
        uses: docker/build-push-action@v6
        with:
          context: hosts/pi/caddy
          file: hosts/pi/caddy/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
